services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: uweek
      POSTGRES_PASSWORD: uweek
      POSTGRES_DB: uweek
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "uweek"]
      interval: 2s
      retries: 15

volumes:
  postgres:
