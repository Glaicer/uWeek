[uweek-postgres]
enabled = true
backend = systemd
journalmatch = CONTAINER_NAME=uweek-db-postgres-1
filter = uweek-postgres
# why: Docker publishes ports past INPUT; DOCKER-USER sees the packet after DNAT, so the port is the container's 5432
chain = DOCKER-USER
port = 5432
maxretry = 5
findtime = 10m
bantime = 1d
